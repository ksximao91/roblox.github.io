<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>房子岩浆模拟器</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070d;
    font-family:-apple-system,BlinkMacSystemFont,
    "SF Pro Display","Helvetica Neue",Arial,sans-serif;
}

canvas{
    display:block;
}

/* =========================
   iOS 风格 HUD
========================= */

#hud{
    position:fixed;
    top:18px;
    left:18px;
    right:18px;
    height:68px;

    display:flex;
    align-items:center;

    padding:10px 18px;

    border-radius:24px;

    background:rgba(255,255,255,.13);

    border:1px solid rgba(255,255,255,.18);

    backdrop-filter:blur(25px) saturate(180%);
    -webkit-backdrop-filter:blur(25px) saturate(180%);

    box-shadow:
        0 12px 40px rgba(0,0,0,.28),
        inset 0 1px rgba(255,255,255,.18);

    color:white;

    z-index:20;
}

.title{
    font-size:17px;
    font-weight:800;
}

.sub{
    font-size:11px;
    opacity:.55;
    margin-top:3px;
}

.stats{
    margin-left:auto;
    display:flex;
    gap:18px;
    font-weight:700;
}

.stat{
    white-space:nowrap;
}

/* =========================
   岩浆警告
========================= */

#danger{
    position:fixed;
    top:100px;
    left:50%;
    transform:translateX(-50%);

    padding:9px 18px;

    border-radius:18px;

    background:rgba(255,65,40,.18);

    border:1px solid rgba(255,100,80,.3);

    backdrop-filter:blur(20px);

    color:#fff;

    font-size:13px;
    font-weight:700;

    opacity:0;

    transition:.3s;

    z-index:20;
}

#danger.show{
    opacity:1;
}

/* =========================
   游戏结束
========================= */

#screen{
    position:fixed;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.85);

    width:min(420px,84vw);

    padding:32px;

    text-align:center;

    color:white;

    border-radius:32px;

    background:rgba(255,255,255,.12);

    border:1px solid rgba(255,255,255,.2);

    backdrop-filter:blur(30px);

    -webkit-backdrop-filter:blur(30px);

    box-shadow:
        0 20px 80px rgba(0,0,0,.45);

    opacity:0;
    pointer-events:none;

    transition:
        .45s cubic-bezier(.2,.9,.2,1);

    z-index:50;
}

#screen.show{
    opacity:1;
    pointer-events:auto;

    transform:
        translate(-50%,-50%)
        scale(1);
}

#screen h1{
    margin:0 0 10px;
    font-size:34px;
}

#screen p{
    margin:0;
    opacity:.65;
}

#restart{
    margin-top:22px;

    padding:13px 28px;

    border:0;

    border-radius:18px;

    color:white;

    background:rgba(255,255,255,.18);

    font-weight:700;

    cursor:pointer;
}

/* =========================
   手机控制
========================= */

#mobile{
    position:fixed;

    left:18px;
    right:18px;
    bottom:22px;

    display:flex;

    justify-content:space-between;

    z-index:30;

    pointer-events:none;
}

.pad{
    display:flex;
    gap:10px;

    pointer-events:auto;
}

.btn{
    width:62px;
    height:62px;

    border-radius:22px;

    display:grid;
    place-items:center;

    color:white;

    font-size:25px;

    background:rgba(255,255,255,.13);

    border:
        1px solid rgba(255,255,255,.18);

    backdrop-filter:blur(20px);

    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.3);
}

.btn:active{
    transform:scale(.9);

    background:
        rgba(255,255,255,.25);
}

@media(min-width:800px){
    #mobile{
        display:none;
    }
}
</style>
</head>

<body>

<div id="hud">

    <div>
        <div class="title">
            🏠 房子岩浆模拟器
        </div>

        <div class="sub">
            HOUSE LAVA SIMULATOR
        </div>
    </div>

    <div class="stats">

        <div class="stat">
            🪙 <span id="coins">0</span>
        </div>

        <div class="stat">
            🌋 <span id="lava">0</span>m
        </div>

    </div>

</div>

<div id="danger">
    ⚠️ 岩浆正在上涨
</div>

<div id="screen">

    <h1 id="screenTitle">
        💀 被岩浆吞没
    </h1>

    <p id="screenText">
        再试一次，跑到屋顶！
    </p>

    <button id="restart">
        重新开始
    </button>

</div>

<div id="mobile">

    <div class="pad">

        <button class="btn" id="left">
            ←
        </button>

        <button class="btn" id="right">
            →
        </button>

    </div>

    <div class="pad">

        <button class="btn" id="jump">
            ↑
        </button>

    </div>

</div>

<!-- Three.js -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

////////////////////////////////////////////////////////////
// 基础
////////////////////////////////////////////////////////////

let scene;
let camera;
let renderer;

let player;
let playerVelocity = new THREE.Vector3();

let keys = {
    forward:false,
    back:false,
    left:false,
    right:false,
    jump:false
};

let grounded = false;

let coins = 0;

let gameOver = false;
let victory = false;

let lavaHeight = 0;

let clock = new THREE.Clock();

const world = [];

////////////////////////////////////////////////////////////
// 初始化
////////////////////////////////////////////////////////////

function init(){

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x070a12);

    scene.fog =
        new THREE.Fog(
            0x070a12,
            15,
            110
        );

    ////////////////////////////////////////////////////////
    // 相机
    ////////////////////////////////////////////////////////

    camera =
        new THREE.PerspectiveCamera(
            65,
            innerWidth / innerHeight,
            .1,
            500
        );

    ////////////////////////////////////////////////////////
    // 渲染器
    ////////////////////////////////////////////////////////

    renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,2)
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    document.body.appendChild(
        renderer.domElement
    );

    ////////////////////////////////////////////////////////
    // 灯光
    ////////////////////////////////////////////////////////

    const ambient =
        new THREE.HemisphereLight(
            0x9bbcff,
            0x21120c,
            1.7
        );

    scene.add(ambient);

    const moon =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    moon.position.set(
        20,
        40,
        20
    );

    moon.castShadow = true;

    moon.shadow.mapSize.width = 2048;
    moon.shadow.mapSize.height = 2048;

    scene.add(moon);

    ////////////////////////////////////////////////////////
    // 房子
    ////////////////////////////////////////////////////////

    createHouse();

    ////////////////////////////////////////////////////////
    // 玩家
    ////////////////////////////////////////////////////////

    createPlayer();

    ////////////////////////////////////////////////////////
    // 岩浆
    ////////////////////////////////////////////////////////

    createLava();

    ////////////////////////////////////////////////////////
    // 金币
    ////////////////////////////////////////////////////////

    createCoins();

    ////////////////////////////////////////////////////////
    // 控制
    ////////////////////////////////////////////////////////

    setupControls();

    ////////////////////////////////////////////////////////
    // 窗口
    ////////////////////////////////////////////////////////

    addEventListener(
        "resize",
        resize
    );

    ////////////////////////////////////////////////////////
    // 开始
    ////////////////////////////////////////////////////////

    animate();
}

////////////////////////////////////////////////////////////
// 创建方块
////////////////////////////////////////////////////////////

function box(
    x,
    y,
    z,
    sx,
    sy,
    sz,
    color=0xffffff
){

    const geometry =
        new THREE.BoxGeometry(
            sx,
            sy,
            sz
        );

    const material =
        new THREE.MeshStandardMaterial({
            color,
            roughness:.75
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    world.push(mesh);

    return mesh;
}

////////////////////////////////////////////////////////////
// 房子
////////////////////////////////////////////////////////////

function createHouse(){

    // 地板

    box(
        0,
        0,
        0,
        40,
        1,
        32,
        0x454b56
    );

    // 墙

    box(
        -20,
        8,
        0,
        1,
        16,
        32,
        0x68717d
    );

    box(
        20,
        8,
        0,
        1,
        16,
        32,
        0x68717d
    );

    box(
        0,
        8,
        -16,
        40,
        16,
        1,
        0x555e69
    );

    // 后墙留出口感

    box(
        0,
        8,
        16,
        40,
        16,
        1,
        0x555e69
    );

    ////////////////////////////////////////////////////////
    // 二楼
    ////////////////////////////////////////////////////////

    box(
        0,
        9,
        0,
        40,
        1,
        32,
        0x59636f
    );

    ////////////////////////////////////////////////////////
    // 三楼
    ////////////////////////////////////////////////////////

    box(
        0,
        18,
        0,
        40,
        1,
        32,
        0x59636f
    );

    ////////////////////////////////////////////////////////
    // 屋顶
    ////////////////////////////////////////////////////////

    box(
        0,
        28,
        0,
        40,
        1,
        32,
        0x303642
    );

    ////////////////////////////////////////////////////////
    // 沙发
    ////////////////////////////////////////////////////////

    box(
        -10,
        2,
        -5,
        8,
        2,
        3,
        0x4c79a8
    );

    box(
        -10,
        4,
        -6,
        8,
        3,
        1,
        0x4c79a8
    );

    ////////////////////////////////////////////////////////
    // 桌子
    ////////////////////////////////////////////////////////

    box(
        5,
        3,
        3,
        7,
        1,
        4,
        0x8b623c
    );

    // 桌腿

    for(
        const x of [-2,2]
    ){

        for(
            const z of [2,4]
        ){

            box(
                5+x,
                1.5,
                z,
                .5,
                3,
                .5,
                0x62452e
            );

        }
    }

    ////////////////////////////////////////////////////////
    // 二楼跑酷箱子
    ////////////////////////////////////////////////////////

    box(
        -12,
        11,
        -3,
        5,
        3,
        5,
        0x9a6b3f
    );

    box(
        -5,
        13,
        4,
        5,
        3,
        5,
        0x9a6b3f
    );

    box(
        5,
        11,
        -4,
        5,
        3,
        5,
        0x9a6b3f
    );

    box(
        13,
        14,
        3,
        5,
        3,
        5,
        0x9a6b3f
    );

    ////////////////////////////////////////////////////////
    // 楼梯
    ////////////////////////////////////////////////////////

    for(let i=0;i<8;i++){

        box(
            -14+i*3,
            1+i*1.1,
            10,
            3,
            1,
            6,
            0x737d89
        );
    }

    ////////////////////////////////////////////////////////
    // 三楼平台
    ////////////////////////////////////////////////////////

    box(
        -12,
        21,
        -5,
        7,
        2,
        6,
        0x73808d
    );

    box(
        0,
        23,
        4,
        7,
        2,
        6,
        0x73808d
    );

    box(
        12,
        25,
        -4,
        7,
        2,
        6,
        0x73808d
    );

    ////////////////////////////////////////////////////////
    // 屋顶逃生平台
    ////////////////////////////////////////////////////////

    box(
        0,
        30,
        0,
        12,
        1,
        12,
        0x67dca0
    );

    // 逃生门

    const door =
        box(
            0,
            32,
            -5.8,
            4,
            5,
            .5,
            0x66ffc0
        );

    door.userData.finish = true;
}

////////////////////////////////////////////////////////////
// 玩家
////////////////////////////////////////////////////////////

function createPlayer(){

    player =
        new THREE.Group();

    ////////////////////////////////////////////////////////
    // 身体
    ////////////////////////////////////////////////////////

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.3,
                1.7,
                .8
            ),
            new THREE.MeshStandardMaterial({
                color:0x4aa8ff
            })
        );

    body.position.y=1.6;

    body.castShadow=true;

    player.add(body);

    ////////////////////////////////////////////////////////
    // 头
    ////////////////////////////////////////////////////////

    const head =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.35,
                1.35,
                1.35
            ),
            new THREE.MeshStandardMaterial({
                color:0xffd0a5
            })
        );

    head.position.y=3.1;

    head.castShadow=true;

    player.add(head);

    ////////////////////////////////////////////////////////
    // 腿
    ////////////////////////////////////////////////////////

    for(
        const x of [-.35,.35]
    ){

        const leg =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .45,
                    1.4,
                    .55
                ),
                new THREE.MeshStandardMaterial({
                    color:0x273c66
                })
            );

        leg.position.set(
            x,
            .15,
            0
        );

        leg.castShadow=true;

        player.add(leg);
    }

    ////////////////////////////////////////////////////////
    // 手
    ////////////////////////////////////////////////////////

    for(
        const x of [-.9,.9]
    ){

        const arm =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .45,
                    1.5,
                    .55
                ),
                new THREE.MeshStandardMaterial({
                    color:0x4aa8ff
                })
            );

        arm.position.set(
            x,
            1.65,
            0
        );

        arm.castShadow=true;

        player.add(arm);
    }

    player.position.set(
        0,
        2,
        8
    );

    scene.add(player);
}

////////////////////////////////////////////////////////////
// 岩浆
////////////////////////////////////////////////////////////

let lava;

function createLava(){

    const geometry =
        new THREE.BoxGeometry(
            200,
            1,
            200
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:0xff3217,
            emissive:0xff2100,
            emissiveIntensity:2,
            roughness:.3
        });

    lava =
        new THREE.Mesh(
            geometry,
            material
        );

    lava.position.y=-3;

    scene.add(lava);

    lavaHeight=-3;
}

////////////////////////////////////////////////////////////
// 金币
////////////////////////////////////////////////////////////

const coinObjects=[];

function createCoins(){

    const positions=[
        [-10,5,-5],
        [5,5,3],
        [-12,14,-3],
        [-5,16,4],
        [5,14,-4],
        [13,17,3],
        [-12,24,-5],
        [0,26,4],
        [12,28,-4],
        [0,33,0]
    ];

    for(
        const p of positions
    ){

        const geometry =
            new THREE.CylinderGeometry(
                .55,
                .55,
                .18,
                32
            );

        const material =
            new THREE.MeshStandardMaterial({
                color:0xffd84d,
                emissive:0xffa800,
                emissiveIntensity:1
            });

        const coin =
            new THREE.Mesh(
                geometry,
                material
            );

        coin.rotation.z =
            Math.PI/2;

        coin.position.set(
            p[0],
            p[1],
            p[2]
        );

        coin.castShadow=true;

        scene.add(coin);

        coinObjects.push(coin);
    }
}

////////////////////////////////////////////////////////////
// 键盘
////////////////////////////////////////////////////////////

function setupControls(){

    addEventListener(
        "keydown",
        e=>{

            if(
                e.key==="w" ||
                e.key==="W" ||
                e.key==="ArrowUp"
            )
                keys.forward=true;

            if(
                e.key==="s" ||
                e.key==="S" ||
                e.key==="ArrowDown"
            )
                keys.back=true;

            if(
                e.key==="a" ||
                e.key==="A" ||
                e.key==="ArrowLeft"
            )
                keys.left=true;

            if(
                e.key==="d" ||
                e.key==="D" ||
                e.key==="ArrowRight"
            )
                keys.right=true;

            if(
                e.key===" " ||
                e.key==="w" ||
                e.key==="W"
            )
                keys.jump=true;
        }
    );

    addEventListener(
        "keyup",
        e=>{

            if(
                e.key==="w" ||
                e.key==="W" ||
                e.key==="ArrowUp"
            )
                keys.forward=false;

            if(
                e.key==="s" ||
                e.key==="S" ||
                e.key==="ArrowDown"
            )
                keys.back=false;

            if(
                e.key==="a" ||
                e.key==="A" ||
                e.key==="ArrowLeft"
            )
                keys.left=false;

            if(
                e.key==="d" ||
                e.key==="D" ||
                e.key==="ArrowRight"
            )
                keys.right=false;

            if(
                e.key===" "
            )
                keys.jump=false;
        }
    );

    ////////////////////////////////////////////////////////
    // 手机
    ////////////////////////////////////////////////////////

    mobileButton(
        "left",
        ()=>{
            keys.left=true;
        },
        ()=>{
            keys.left=false;
        }
    );

    mobileButton(
        "right",
        ()=>{
            keys.right=true;
        },
        ()=>{
            keys.right=false;
        }
    );

    mobileButton(
        "jump",
        ()=>{
            keys.jump=true;
        },
        ()=>{
            keys.jump=false;
        }
    );
}

function mobileButton(
    id,
    down,
    up
){

    const b =
        document.getElementById(id);

    b.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            down();
        }
    );

    b.addEventListener(
        "pointerup",
        up
    );

    b.addEventListener(
        "pointercancel",
        up
    );
}

////////////////////////////////////////////////////////////
// 玩家物理
////////////////////////////////////////////////////////////

function updatePlayer(){

    if(gameOver || victory)
        return;

    ////////////////////////////////////////////////////////
    // 第三人称移动方向
    ////////////////////////////////////////////////////////

    let direction =
        new THREE.Vector3();

    if(keys.forward)
        direction.z -= 1;

    if(keys.back)
        direction.z += 1;

    if(keys.left)
        direction.x -= 1;

    if(keys.right)
        direction.x += 1;

    if(direction.length()>0){

        direction.normalize();

        playerVelocity.x +=
            direction.x*.35;

        playerVelocity.z +=
            direction.z*.35;
    }

    playerVelocity.x *= .82;
    playerVelocity.z *= .82;

    ////////////////////////////////////////////////////////
    // 跳跃
    ////////////////////////////////////////////////////////

    if(
        keys.jump &&
        grounded
    ){

        playerVelocity.y=10;

        grounded=false;
    }

    ////////////////////////////////////////////////////////
    // 重力
    ////////////////////////////////////////////////////////

    playerVelocity.y -= .45;

    player.position.add(
        playerVelocity
    );

    ////////////////////////////////////////////////////////
    // 简单地面
    ////////////////////////////////////////////////////////

    if(
        player.position.y<2
    ){

        player.position.y=2;

        playerVelocity.y=0;

        grounded=true;
    }

    ////////////////////////////////////////////////////////
    // 楼层
    ////////////////////////////////////////////////////////

    const floors=[
        0.5,
        9.5,
        18.5,
        28.5
    ];

    for(
        const floor of floors
    ){

        if(
            player.position.y>=floor &&
            player.position.y<floor+2
        ){

            if(
                playerVelocity.y<=0
            ){

                player.position.y=floor+1.5;

                playerVelocity.y=0;

                grounded=true;
            }
        }
    }

    ////////////////////////////////////////////////////////
    // 跑出房子限制
    ////////////////////////////////////////////////////////

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -18,
            18
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -14,
            14
        );

    ////////////////////////////////////////////////////////
    // 岩浆死亡
    ////////////////////////////////////////////////////////

    if(
        player.position.y<
        lavaHeight+2
    ){

        die();
    }

    ////////////////////////////////////////////////////////
    // 金币碰撞
    ////////////////////////////////////////////////////////

    for(
        let i=coinObjects.length-1;
        i>=0;
        i--
    ){

        const c =
            coinObjects[i];

        if(
            c.position.distanceTo(
                player.position
            )<2
        ){

            scene.remove(c);

            coinObjects.splice(
                i,
                1
            );

            coins++;

            document.getElementById(
                "coins"
            ).textContent=coins;
        }
    }

    ////////////////////////////////////////////////////////
    // 逃生
    ////////////////////////////////////////////////////////

    if(
        player.position.y>30 &&
        Math.abs(player.position.x)<6 &&
        Math.abs(player.position.z)<7
    ){

        win();
    }
}

////////////////////////////////////////////////////////////
// 岩浆
////////////////////////////////////////////////////////////

function updateLava(){

    if(gameOver || victory)
        return;

    lavaHeight += .0025;

    lava.position.y =
        lavaHeight;

    document.getElementById(
        "lava"
    ).textContent =
        Math.max(
            0,
            Math.round(
                lavaHeight+3
            )
        );

    if(
        lavaHeight>5
    ){

        document.getElementById(
            "danger"
        ).classList.add(
            "show"
        );
    }
}

////////////////////////////////////////////////////////////
// 第三人称相机
////////////////////////////////////////////////////////////

function updateCamera(){

    const target =
        new THREE.Vector3(
            player.position.x,
            player.position.y+3,
            player.position.z
        );

    const desired =
        new THREE.Vector3(
            player.position.x,
            player.position.y+7,
            player.position.z+12
        );

    camera.position.lerp(
        desired,
        .08
    );

    camera.lookAt(
        target
    );
}

////////////////////////////////////////////////////////////
// 死亡
////////////////////////////////////////////////////////////

function die(){

    if(gameOver)
        return;

    gameOver=true;

    document.getElementById(
        "screenTitle"
    ).textContent =
        "🌋 被岩浆吞没";

    document.getElementById(
        "screenText"
    ).textContent =
        "岩浆已经上涨到你的位置。";

    document.getElementById(
        "screen"
    ).classList.add(
        "show"
    );
}

////////////////////////////////////////////////////////////
// 胜利
////////////////////////////////////////////////////////////

function win(){

    if(victory)
        return;

    victory=true;

    document.getElementById(
        "screenTitle"
    ).textContent =
        "🏆 成功逃生！";

    document.getElementById(
        "screenText"
    ).textContent =
        "你成功跑到了屋顶！金币："
        +coins;

    document.getElementById(
        "screen"
    ).classList.add(
        "show"
    );
}

////////////////////////////////////////////////////////////
// 重启
////////////////////////////////////////////////////////////

document.getElementById(
    "restart"
).onclick=()=>{

    location.reload();
};

////////////////////////////////////////////////////////////
// Resize
////////////////////////////////////////////////////////////

function resize(){

    camera.aspect =
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
}

////////////////////////////////////////////////////////////
// 动画
////////////////////////////////////////////////////////////

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta =
        clock.getDelta();

    ////////////////////////////////////////////////////////
    // 金币旋转
    ////////////////////////////////////////////////////////

    for(
        const c of coinObjects
    ){

        c.rotation.y +=
            delta*3;

        c.position.y +=
            Math.sin(
                Date.now()/300
            )*.002;
    }

    ////////////////////////////////////////////////////////
    // 玩家
    ////////////////////////////////////////////////////////

    updatePlayer();

    ////////////////////////////////////////////////////////
    // 岩浆
    ////////////////////////////////////////////////////////

    updateLava();

    ////////////////////////////////////////////////////////
    // 相机
    ////////////////////////////////////////////////////////

    updateCamera();

    ////////////////////////////////////////////////////////
    // 渲染
    ////////////////////////////////////////////////////////

    renderer.render(
        scene,
        camera
    );
}

////////////////////////////////////////////////////////////
// START
////////////////////////////////////////////////////////////

init();

</script>

</body>
</html>
